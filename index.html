<style id="kh-skin">
:root{--accent:#4aa8e8;--bg:#ffffff;--card:#ffffff;--card2:#f2f2f2;--input:#f9f9f9;--ink:#333333;--ink-soft:#777777;--line:#e5e5e5;

html,body{background:var(--bg)}
body{background:var(--bg)!important;background-image:none!important;color:var(--ink)}
header.top{border-bottom:2px solid var(--line)}

.icons{display:flex;gap:8px}

.icon-btn:hover{background:var(--card2);transform:translateY(-2px)}.icon-btn:active{transform:scale(.92)}
.icon-btn.pro{color:var(--accent);border-color:var(--accent)}
.ic{display:inline-flex;vertical-align:-.2em}
.ic svg{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab-btn,.chip-toggle,.gt-card{background:var(--card2);color:var(--ink);border-color:var(--line)}
.tab-btn.active,.chip-toggle.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.add-btn{background:var(--accent);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.add-btn.secondary{background:var(--paid-green)}.add-btn.blue{background:var(--accent)}

.field input:focus,.field select:focus,.search-wrap input:focus{outline-color:var(--accent)}
.modal{background:var(--card);color:var(--ink)}.modal h3{color:var(--accent)}
.modal-actions .confirm,.auth-btn{background:var(--accent)}
.avatar{background:var(--accent)}.back-btn{color:var(--accent)}.auth-card h1{color:var(--accent)}
.plan-card.selected{border-color:var(--accent);background:var(--card2)}.plan-card .plan-price{color:var(--accent)}
.pin-dots .dot.filled{background:var(--accent);border-color:var(--accent)}
.picker-item:hover{background:var(--card2)}
.pay-box{background:var(--card2);border-color:var(--line)}.pay-box b{color:var(--accent)}
.ad-card .ad-actions button{background:var(--card2);color:var(--ink-soft)}
.toast{z-index:400}
.plan-strip{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);margin-bottom:14px;cursor:pointer}

.plan-strip .ps-t{font-weight:800;font-size:14px}.plan-strip .ps-s{font-size:12px;color:var(--ink-soft);margin-top:2px}
.plan-strip .ps-bar{height:6px;border-radius:6px;background:var(--line);margin-top:6px;overflow:hidden}.plan-strip .ps-bar i{display:block;height:100%;background:var(--accent)}
.plan-strip .ps-go{margin-left:auto;font-size:12px;font-weight:800;color:var(--accent);white-space:nowrap}
.set-h{display:flex;align-items:center;gap:8px;margin:4px 0 2px;font-size:22px}
.set-crumb{font-size:11px;color:var(--ink-soft);margin-bottom:14px}
.set-list{display:flex;flex-direction:column;gap:8px}
