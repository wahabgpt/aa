<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow"><title>My Khata — Admin</title>
<style>
:root{--paper:#F4F5F7;--ink:#111;--soft:#5F6670;--red:#111;--green:#2F8FCB;--blue:#4DA3DB;--line:rgba(17,17,17,.13)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:16px}
.wrap{max-width:720px;margin:0 auto}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h1{margin:0 0 10px;font-size:22px;color:var(--red)}input{width:100%;padding:11px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;font:inherit}
button{border:0;border-radius:8px;padding:9px 12px;font:inherit;font-weight:700;color:#fff;background:var(--red);cursor:pointer}button.b{background:var(--blue)}button.ok{background:var(--green)}button.g{background:transparent;color:var(--soft);border:1px solid var(--line)}button.on{outline:2px solid var(--red)}
.u{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}.u small{color:var(--soft);display:block}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:rgba(47,143,203,.15);color:var(--green)}.tag.x{background:rgba(17,17,17,.08);color:var(--red)}
#m{color:var(--red);font-size:13px;font-weight:700;min-height:18px}[hidden]{display:none!important}
.sec{display:flex;gap:8px;margin:14px 0 10px}.sec button{flex:1}
.ad h3{margin:0 0 4px;font-size:16px;word-break:break-word}.ad p{margin:2px 0;font-size:13px;color:var(--soft);word-break:break-word}.ad a{color:var(--blue);font-size:12px;word-break:break-all}
</style></head><body><div class="wrap">
<div class="card" id="login"><h1>🔐 Admin Login</h1>
<input id="e" type="text" placeholder="Admin email ya username" autocapitalize="none" autocomplete="username"><input id="p" type="password" placeholder="Password"><div id="m"></div><button id="go" style="width:100%">Login</button></div>
<div id="panel" hidden>
<div class="card"><div class="u"><h1 style="margin:0">Admin</h1><button class="g" id="out">Sign out</button></div>
<div class="sec"><button id="tabU" class="on">👥 Users</button><button id="tabA" class="g">📢 Ads</button></div></div>

<div id="usersView"><div class="card"><input id="q" placeholder="Email ya shop name se dhundein"><div id="cnt" style="font-size:12px;color:var(--soft)"></div></div><div id="list"></div></div>

<div id="adsView" hidden>
<div class="card"><div class="sec" style="margin:0"><button id="adP" class="on">⏳ Pending</button><button id="adA" class="g">✅ Approved</button></div>
<div id="adCnt" style="font-size:12px;color:var(--soft);margin-top:8px"></div></div>
<div id="adList"></div></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
const sb=supabase.createClient(KHATA_CFG.URL,KHATA_CFG.KEY,{auth:{storageKey:'sb-khata-admin'}}),$=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let users=[],ads=[],adTab='pending';
async function enter(){
  const {data:{user}}=await sb.auth.getUser(); if(!user)return;
  const r=await sb.from('profiles').select('is_admin').eq('id',user.id).maybeSingle();
  if(!r.data||!r.data.is_admin){await sb.auth.signOut();$('m').textContent='Ye account admin nahi hai.';return;}
  $('login').hidden=true;$('panel').hidden=false;load();
}
async function load(){
  const r=await sb.from('profiles').select('*').order('created_at',{ascending:false}); if(r.error){alert(r.error.message);return;}
  users=r.data;draw();
}
function draw(){
  const q=$('q').value.toLowerCase(),now=Date.now();
  const l=users.filter(u=>((u.email||'')+' '+(u.shop_name||'')).toLowerCase().includes(q));
  $('cnt').textContent=l.length+' users';
  $('list').innerHTML=l.map(u=>{const ex=u.plan_expires_at?new Date(u.plan_expires_at).getTime():0,on=ex>now;
    return `<div class="card"><div class="u"><div><b>${esc(u.email)}</b><small>${esc(u.shop_name||'-')} • ${u.customer_count||0} customers</small>
    <small>${on?'Expiry: '+new Date(ex).toLocaleDateString('en-GB'):'Free plan'}</small></div><span class="tag ${on?'':'x'}">${on?esc(u.plan).toUpperCase():'FREE'}</span></div>
    <div class="u" style="margin-top:10px"><button class="b" data-i="${u.id}" data-p="monthly">+30 din (Rs 24)</button><button class="b" data-i="${u.id}" data-p="yearly">+365 din (Rs 159)</button><button class="g" data-i="${u.id}" data-p="none">Band karein</button></div></div>`}).join('');
}
$('list').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(!confirm('Pakka? '+b.textContent))return;
  const r=await sb.rpc('admin_set_plan',{p_uid:b.dataset.i,p_plan:b.dataset.p});
  if(r.error)alert(r.error.message);else load();};
$('q').oninput=draw;

/* ---------- tabs ---------- */
function showTab(t){
  $('usersView').hidden=t!=='u';$('adsView').hidden=t!=='a';
  $('tabU').className=t==='u'?'on':'g';$('tabA').className=t==='a'?'on':'g';
  if(t==='a')loadAds();
}
$('tabU').onclick=()=>showTab('u');$('tabA').onclick=()=>showTab('a');

/* ---------- ads review ---------- */
async function loadAds(){
  $('adP').className=adTab==='pending'?'on':'g';$('adA').className=adTab==='approved'?'on':'g';
  const r=await sb.rpc('admin_list_ads',{p_status:adTab});
  if(r.error){alert(r.error.message);return;}
  ads=r.data||[];drawAds();
}
function safeHref(u){return /^https?:\/\/[^\s]+$/i.test(u)?u:'#';}
function drawAds(){
  $('adCnt').textContent=ads.length+(adTab==='pending'?' ads waiting for review':' approved ads');
  $('adList').innerHTML=ads.length?ads.map(a=>`<div class="card ad"><h3>${esc(a.title)}</h3>
    ${a.detail?'<p>'+esc(a.detail)+'</p>':''}${a.comment?'<p>💬 '+esc(a.comment)+'</p>':''}
    <p><a href="${esc(safeHref(a.link))}" target="_blank" rel="noopener noreferrer">🔗 ${esc(a.link)}</a> <small style="display:inline">(open and check it yourself first)</small></p>
    <p style="font-size:12px">by ${esc(a.email||'-')} • 👍 ${a.likes} • 🚩 ${a.reports} • ${new Date(a.created_at).toLocaleDateString('en-GB')}</p>
    <div class="u" style="margin-top:10px">${adTab==='pending'
      ?`<button class="ok" data-a="${a.id}" data-act="approve">✅ Approve</button><button data-a="${a.id}" data-act="reject">⛔ Reject</button>`
      :`<button data-a="${a.id}" data-act="delete">🗑️ Remove</button>`}</div></div>`).join('')
    :'<div class="card" style="text-align:center;color:var(--soft)">Nothing here.</div>';
}
$('adP').onclick=()=>{adTab='pending';loadAds();};$('adA').onclick=()=>{adTab='approved';loadAds();};
$('adList').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  const id=b.dataset.a,act=b.dataset.act;let r;
  if(act==='approve'){if(!confirm('Approve this ad? Everyone will see it.'))return;r=await sb.rpc('admin_review_ad',{p_id:id,p_approve:true});}
  else if(act==='reject'){if(!confirm('Reject this ad?'))return;r=await sb.rpc('admin_review_ad',{p_id:id,p_approve:false});}
  else if(act==='delete'){if(!confirm('Remove this ad permanently?'))return;r=await sb.rpc('admin_delete_ad',{p_id:id});}
  if(r&&r.error)alert(r.error.message);else loadAds();};

$('go').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:(v=>v.includes('@')?v:v+'@gmail.com')($('e').value.trim().toLowerCase()),password:$('p').value});
  if(r.error){$('m').textContent=r.error.message;return;}enter();};
$('out').onclick=async()=>{await sb.auth.signOut();location.reload();};
enter();
})();
</script></body></html>
